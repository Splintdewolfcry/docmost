services:
  docmost:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - redis
    environment:
      APP_URL: '${APP_URL:-https://docmost.liproject.net}'
      APP_SECRET: '${APP_SECRET:?Run ./deploy.sh first — APP_SECRET is missing from .env}'
      DATABASE_URL: 'postgresql://docmost:${DB_PASSWORD:?Run ./deploy.sh first — DB_PASSWORD is missing from .env}@db:5432/docmost'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "${HTTP_PORT:-3001}:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: '${DB_PASSWORD:?Run ./deploy.sh first — DB_PASSWORD is missing from .env}'
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
